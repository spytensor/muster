<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'"
    />
    <title>Muster</title>
    <link rel="stylesheet" href="setup.css" />
  </head>
  <body>
    <main>
      <img src="mark.svg" alt="" width="56" height="56" />
      <h1 data-t="title">Connect to Muster</h1>
      <p data-t="lead"></p>
      <form>
        <label for="server" data-t="label">Server address</label>
        <input id="server" name="server" type="url" required placeholder="https://muster.example.com" />
        <p class="error" role="alert" hidden></p>
        <button type="submit" data-t="go"></button>
      </form>
    </main>
    <script src="setup.js"></script>
  </body>
</html>
