packages:
  - "apps/*"
  # The mobile app is an Expo project with its own npm lockfile.
  - "!apps/mobile"
  - "packages/*"
  - "vendor/openclaw/*"

# esbuild (used by tsx and vite) runs an install script; no other dependency may.
# OpenUI's install script only reports telemetry, so it is refused.
allowBuilds:
  esbuild: true
  # Electron's install script downloads the runtime the desktop app is built on.
  electron: true
  "@openuidev/lang-core": false

minimumReleaseAgeExclude:
  - electron@45.3.2
