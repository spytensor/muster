name: Bug
description: Something does not do what it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it
      placeholder: "1. …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release, or the commit you built from.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options: [Web, Desktop, iOS, Admin console, Server, Sandbox, Deployment]
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: The model you use, logs, a screenshot. Take keys and addresses out first.
