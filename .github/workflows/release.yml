# A release: a tag vX.Y.Z on a commit of main makes the images and the GitHub Release.
# How a release is prepared is in docs/releasing.md.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # GitHub's own machines, never a self-hosted runner: this repository is public.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # the GitHub Release
      packages: write   # the images
    steps:
      # Actions are pinned by commit; the comment is the version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The tag is read from the environment, never spliced into a command.
      - name: The tag, the version and the changelog agree
        id: meta
        env:
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          base="${version%%-rc*}"
          declared="$(node -p "require('./package.json').version")"
          [ "$declared" = "$base" ] || { echo "package.json says $declared, the tag says $base" >&2; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "the tag is not on main" >&2; exit 1; }
          # The changelog entry: from its heading to the next one.
          awk -v v="$base" '$0 ~ "^## " v "( |$)" {on=1; next} on && /^## / {exit} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ -s "$RUNNER_TEMP/notes.md" ] || { echo "CHANGELOG.md has no entry for $base" >&2; exit 1; }
          {
            echo "version=$version"
            echo "image=ghcr.io/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
            case "$version" in *-rc*) echo "candidate=true" ;; *) echo "candidate=false" ;; esac
          } >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Build and push the images
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          CANDIDATE: ${{ steps.meta.outputs.candidate }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker build --build-arg "MUSTER_COMMIT=$GITHUB_SHA" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t "$IMAGE:$VERSION" .
          docker build --build-arg "MUSTER_COMMIT=$GITHUB_SHA" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -f apps/sandbox/Dockerfile -t "$IMAGE-sandbox:$VERSION" .
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE-sandbox:$VERSION"
          if [ "$CANDIDATE" = "false" ]; then
            for name in "$IMAGE" "$IMAGE-sandbox"; do
              docker tag "$name:$VERSION" "$name:latest"
              docker push "$name:latest"
            done
          fi

      - name: The GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          CANDIDATE: ${{ steps.meta.outputs.candidate }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$CANDIDATE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" --title "Muster ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag "${flags[@]}"
