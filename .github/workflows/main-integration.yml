# Post-merge integration check (Standard P11): the full build+test on main after every
# merge catches semantic conflicts between independently-green PRs. A red run on main
# is the signal: stop new work until it is green.
name: main-integration

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: main-integration
  cancel-in-progress: false   # don't skip a commit's integration result

jobs:
  integrate:
    # GitHub's own machines, never a self-hosted runner: this repository is public, and a
    # pull request from a fork would run its code on that machine.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Full build + test (not changed-files only)
        id: build
        run: |
          set -e
          pnpm install --frozen-lockfile
          pnpm check
